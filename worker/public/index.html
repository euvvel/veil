<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>veil</title>
  <style>
    :root { --void: #0b0a0f; --ink: rgba(233,230,242,.55); }
    @media (prefers-color-scheme: light) { :root { --void: #f4f2ee; --ink: rgba(29,26,36,.55); } }
    html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); }
    body { display: grid; place-items: center; font: 15px/1.4 Georgia, "Times New Roman", serif; letter-spacing: .04em; }
  </style>
</head>
<body>
  <p>The veil is closed.</p>
</body>
</html>
